<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alcove New Joiner Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#204768;--gold:#EFCC25;--gold-d:#b6910f;--red:#D82A30;--ink:#1c3654;--bg:#f4f7fb;--card:#fff;--line:#e1e8f1;--muted:#5f6f85;--field:#f8fafd;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e4ebf4;--bg:#0f1c2b;--card:#16273a;--line:#29405a;--muted:#9aabc2;--field:#1b2f45;--gold-d:#EFCC25}}
:root[data-theme="dark"]{--ink:#e4ebf4;--bg:#0f1c2b;--card:#16273a;--line:#29405a;--muted:#9aabc2;--field:#1b2f45;--gold-d:#EFCC25}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5}
header{background:linear-gradient(135deg,#16324e,#204768);color:#fff;padding:18px 20px 22px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}
header .wrap{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:14px}
header h1{margin:0;font-size:1.35rem;font-weight:600}
header p{margin:2px 0 0;color:#c9d6e6;font-size:.9rem}
main{max-width:1220px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){main{grid-template-columns:1fr;padding:14px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
.form{padding:18px}
h2{font-size:1rem;margin:0 0 12px}
legend,.sec{font-weight:600;font-size:.86rem;color:var(--gold-d);padding:0 0 6px;border-bottom:2px solid var(--gold);margin:0 0 10px;width:100%;display:block}
fieldset{border:none;margin:0 0 12px;padding:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:11px}
input,select{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit;font-size:.92rem}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--navy)}
details{margin:6px 0 14px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--ink)}
summary small{font-weight:400;color:var(--muted)}
details[open] summary{margin-bottom:12px}
.ph-row{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.ph-prev{width:64px;height:80px;border:1px dashed var(--line);border-radius:4px;background:var(--field) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted)}
.ph-row input{font-size:.82rem;padding:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:.9rem;border-radius:6px;padding:9px 14px;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.sm{padding:5px 10px;font-size:.82rem;margin-top:6px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.out{overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:880px){.out{position:static}}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--field)}
.tabs button{background:none;color:var(--muted);border:none;border-bottom:3px solid transparent;border-radius:0;padding:12px 14px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .desc{color:var(--muted);font-size:.85rem}
.view{padding:18px}
#cardview canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff}
#cardview canvas.portrait{max-width:560px;margin:0 auto}
.designs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.designs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--field);font-size:.78rem;font-weight:600;color:var(--muted);text-align:center}
.designs button canvas{display:block;width:100%;height:96px;object-fit:contain;border:0!important;background:transparent!important}
.designs button[aria-checked="true"]{border-color:var(--gold);color:var(--ink)}
.designs button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
@media (max-width:560px){.designs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.adj{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:.82rem;color:var(--muted)}
.adj label{display:flex;align-items:center;gap:8px;margin:0}
.adj input{width:140px;margin:0;padding:0}
#doc{max-height:70vh;overflow:auto;padding:4px 6px}
@media (max-width:880px){#doc{max-height:none}}
.subj{background:var(--field);border-left:4px solid var(--gold);padding:8px 12px;margin-bottom:16px;font-size:.92rem}
.body{white-space:pre-wrap;font-size:.95rem;line-height:1.65;max-width:72ch}
.miss{background:#fdf6da;color:#6b571f;border-radius:3px;padding:0 3px}
.photo{float:right;width:120px;height:150px;margin:0 0 14px 18px;border:2px dashed var(--muted);border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.78rem;color:var(--muted);overflow:hidden;background:var(--field)}
.photo.has{border:2px solid var(--navy)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:480px){.photo{width:96px;height:120px}}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:6px;border-bottom:3px solid var(--gold);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media print{header,.form,.tabs,.toolbar,.adj,.toast{display:none!important}body{background:#fff;color:#000}main{display:block;padding:0}.panel{border:none}.view{padding:0}#doc{max-height:none;overflow:visible}.miss{background:none}#cardview canvas{border:none;border-radius:0}.designs{display:none!important}#cardview canvas.portrait{max-width:none}.photo{border:1.5px solid #000;background:#fff;color:#000}}
</style>
</head>

  const PO="Poppins, 'Segoe UI', Arial, sans-serif",UB="Ubuntu, 'Segoe UI', Arial, sans-serif";
  const DESIGNS=[["classic","Classic"],["joinee","New Joinee"],["family","Alcove Family"],["announce","Announcement"]];
  let design=(()=>{try{const d=localStorage.getItem("nj_design");return DESIGNS.some(x=>x[0]===d)?d:"classic";}catch(e){return"classic";}})();
  function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();}
  // letter-spaced text (canvas letterSpacing where supported, else one letter at a time)
  function spaced(x,t,X,Y,sp,align){if("letterSpacing" in x){x.save();x.letterSpacing=sp+"px";x.textAlign=align||"left";
      const w=x.measureText(t).width;x.textAlign="left";const sx=align==="center"?X-(w-sp)/2:align==="right"?X-(w-sp):X;x.fillText(t,sx,Y);x.restore();return;}
    const ws=[...t].map(ch=>x.measureText(ch).width),tw=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);let cx=align==="center"?X-tw/2:align==="right"?X-tw:X;
    x.save();x.textAlign="left";[...t].forEach((ch,i)=>{x.fillText(ch,cx,Y);cx+=ws[i]+sp;});x.restore();}
  // shrink a font until the text fits
  function fitFont(x,t,weight,size,fam,maxW){let s=size;x.font=weight+" "+s+"px "+fam;while(x.measureText(t).width>maxW&&s>12){s--;x.font=weight+" "+s+"px "+fam;}return s;}
  // centred paragraph with bold parts: parts=[[text,bold,placeholder]]
  function para(x,parts,cx,y,maxW,lh,reg,bold,col,bcol){const toks=[];parts.forEach(([t,b,ph])=>String(t).split(/(\s+)/).forEach(w=>{if(w)toks.push({w,b,ph});}));
    const f=k=>k.b?bold:reg,lines=[[]];let lw=0;
    toks.forEach(k=>{x.font=f(k);const w=x.measureText(k.w).width;if(/^\s+$/.test(k.w)){if(lines[lines.length-1].length)lines[lines.length-1].push({...k,wd:w});lw+=w;return;}
      if(lw+w>maxW&&lines[lines.length-1].length){const L=lines[lines.length-1];while(L.length&&/^\s+$/.test(L[L.length-1].w))L.pop();lines.push([]);lw=0;}
      lines[lines.length-1].push({...k,wd:w});lw+=w;});
    lines.forEach((L,i)=>{while(L.length&&/^\s+$/.test(L[L.length-1].w))L.pop();const tw=L.reduce((a,k)=>a+k.wd,0);let px=cx-tw/2;
      L.forEach(k=>{x.font=f(k);x.fillStyle=k.ph?GREY:(k.b?bcol:col);x.textAlign="left";x.fillText(k.w,px,y+i*lh);px+=k.wd;});});}
  // photo, cover-fit into a clipped area, with the zoom / up-down sliders
  function photoIn(x,X,Y,W,H,clip){x.save();clip();x.clip();
    if(photoImg){const r=Math.max(W/photoImg.width,H/photoImg.height)*zoom,w=photoImg.width*r,h=photoImg.height*r;x.drawImage(photoImg,X+(W-w)/2,Y-Math.max(0,h-H)*(0.2+shiftY),w,h);}
    else{x.fillStyle="#eef1f5";x.fillRect(X,Y,W,H);x.fillStyle=GREY;x.font="500 26px "+PO;x.textAlign="center";x.fillText("Photo",X+W/2,Y+H/2+9);x.textAlign="left";}
    x.restore();}
  function logo(x,X,Y,W){if(LOGO.complete&&LOGO.naturalWidth)x.drawImage(LOGO,X,Y,W,W*LOGO.naturalHeight/LOGO.naturalWidth);}
  function info(){return{nm:val("name","Name"),ds:val("desig","Designation"),lc:val("loc","Location"),cn:val("cno","Contact No."),em:val("email","Email ID")};}

  // 1) "New Joinee" — white card, orange waves (1280×1600)
  function drawJoinee(c){c.width=1280;c.height=1600;const x=c.getContext("2d"),I=info(),NAVY="#0f4c81",OR="#f7943a";
    x.fillStyle="#fff";x.fillRect(0,0,1280,1600);
    const wave=()=>{x.fillStyle="#fbc48d";x.beginPath();x.moveTo(0,0);x.lineTo(335,0);x.bezierCurveTo(270,95,170,165,0,255);x.closePath();x.fill();
      x.fillStyle=OR;x.beginPath();x.moveTo(0,0);x.lineTo(265,0);x.bezierCurveTo(205,70,120,125,0,185);x.closePath();x.fill();
      x.strokeStyle="rgba(247,148,58,.55)";x.lineWidth=2;x.beginPath();x.moveTo(0,300);x.bezierCurveTo(140,215,290,120,380,0);x.stroke();
      x.fillStyle="rgba(247,148,58,.28)";for(let px=6;px<340;px+=11)for(let py=6;py<300;py+=11){const edge=255*Math.pow(Math.max(0,1-px/335),1.15);if(py>edge&&py<edge+34)x.fillRect(px,py,3,3);}};

  /* ---------- Text templates ---------- */
  function v(id,label){const x=raw(id);return x?x:MISS+"["+label+"]"+MEND;}

  function fmtDate(withDay){const d=raw("doj");if(!d)return MISS+"[Date of joining]"+MEND;
    const o={day:"numeric",month:"long",year:"numeric"};if(withDay)o.weekday="long";
    return new Date(d+"T00:00:00").toLocaleDateString("en-IN",o);}
  function hm(mins){let h=Math.floor(mins/60),m=mins%60;const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap;}
  function fmtTime(){const t=raw("rtime");if(!t)return MISS+"[Reporting time]"+MEND;const[h,m]=t.split(":").map(Number);return hm(h*60+m);}
  function where(){const a=raw("addr");return a?a:v("loc","Location");}
  function mgrLine(){const d=raw("mgrd");return v("mgr","Reporting manager")+(d?" ("+d+")":"");}
  function sign(){const l=["Warm regards,",v("hrname","HR name"),v("hrdesig","HR designation")+" – Human Resources",raw("company")];
    const c=[raw("hrphone"),raw("hremail")].filter(Boolean).join(" | ");if(c)l.push(c);return l.join("\n");}

Congratulations once again, and welcome to ${raw("company")}! We are delighted to have you join us as ${v("desig","Designation")} at ${v("loc","Location")}.

Your joining details are as follows:

Date of joining: ${fmtDate(true)}
Reporting time: ${fmtTime()}
Address: ${where()}
Reporting to: ${mgrLine()}${raw("empid")?"\nEmployee ID: "+raw("empid"):""}${b?"\nOnboarding buddy: "+b:""}

On your first day, please report to the HR desk, where we will complete your joining formalities and induction before introducing you to your team.

Please carry the original and one self-attested photocopy of each document listed in the attached checklist. If anything is unavailable, let us know in advance so we can plan accordingly.

Should you have any questions before your joining date, feel free to reach out to me directly.

${sign()}`;}},

        if(exp)items.push("Relieving letter / experience letter from "+(raw("prev")||"previous employer"),"Last 3 months' payslips","UAN number (if previously enrolled in EPF)","Form 16 / income details from the previous employer (current financial year)");
        items.push("Bank details: cancelled cheque or first page of passbook (savings account in your name)","Emergency contact name, relationship and phone number","Nominee details for PF / gratuity / insurance");
        return `JOINING DOCUMENT CHECKLIST
${raw("company")}

Name: ${v("name","Name")}
Designation: ${v("desig","Designation")}
Location: ${v("loc","Location")}
Date of joining: ${fmtDate(false)}

Please bring originals along with one self-attested photocopy of each:

${items.map(i=>"☐  "+i).join("\n")}

☐  Documents verified          ☐  Employee file created
☐  ID card requested          ☐  Email / ERP access requested
☐  Attendance (biometric) enrolment          ☐  Bank / PF / insurance details updated

Verified by: ______________________     Date: ______________`;}},

${first()} will be reporting to ${mgrLine()}${p?" and joins us from "+p:""}.

${sign()}`;}},

${sign()}`;}}
