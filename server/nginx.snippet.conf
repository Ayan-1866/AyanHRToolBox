# Add inside the existing  server { server_name employees.alcoverealty.in; ... }  block.
# Then:  sudo nginx -t && sudo systemctl reload nginx

    # the login page and its API
    location /auth/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # internal check used by auth_request below
    location = /auth-check-internal {
        internal;
        proxy_pass http://127.0.0.1:8090/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Auth-Mode nginx;
    }

    # lock the HR Tool: no valid sign-in -> sent to /auth/login
    location /p/hr-tool-box/ {
        auth_request /auth-check-internal;
        error_page 401 = @hr_login;
        # ... keep whatever was here before that serves the files (root / alias / proxy_pass) ...
    }
    location @hr_login {
        return 302 /auth/login?next=$request_uri;
    }
